[package]
name = "ss-tariff"
version = "0.1.0"
description = "Private, local-first screenshot memory for Windows and mobile"
authors = ["SS TARIFF"]
license = ""
repository = "https://github.com/avenkoze/ss-tariff"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ss_tariff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
dirs = "6.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.20.0", features = ["v4"] }
anyhow = "1.0.104"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = "8.2.0"
tauri-plugin-updater = "2"
trash = "5.2.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }
